# Spring Boot Configuration (Cloud-provided PORT support with 8080 default)
server.port=${PORT:8080}

# Application Details
spring.application.name=campus-navigation-chatbot

# Python Intent Classifier Microservice URL (Environment variable support with local fallback)
python.classifier.url=${PYTHON_CLASSIFIER_URL:http://127.0.0.1:5000/classify}
python.classifier.health-url=${PYTHON_CLASSIFIER_HEALTH_URL:http://127.0.0.1:5000/health}
python.classifier.timeout-ms=${PYTHON_CLASSIFIER_TIMEOUT_MS:3000}

# Logging
logging.level.com.campusnav=INFO
logging.level.org.springframework.web=INFO
